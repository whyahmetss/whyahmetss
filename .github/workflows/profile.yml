name: ARAMETRIC profile artwork

# assets/profile/ is generated by scripts/profile/build.py (deterministic, no live data).
# On every PR the artwork is rebuilt and must match what is committed.
on:
  pull_request:
    paths:
      - README.md
      - 'assets/profile/**'
      - 'scripts/**'
      - '.github/workflows/profile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install build dependencies
        run: pip install -r scripts/profile/requirements.txt
      - name: Rebuild artwork and compare
        run: |
          python3 scripts/profile/build.py
          git diff --exit-code -- assets/profile
          test -z "$(git ls-files --others --exclude-standard -- assets/profile)"
      - name: Check README references
        run: |
          grep -oE 'assets/profile/[a-z-]+\.svg' README.md | sort -u | while read f; do test -f "$f" || { echo "missing $f"; exit 1; }; done
